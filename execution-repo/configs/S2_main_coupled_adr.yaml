stage: S2
dataset:
  root_dir: data/coupled_adr_v1
  manifest_path: data/coupled_adr_v1/manifest.json
model:
  name: PCR-NO
  hidden_dim: 128
  proj_dim: 64
  num_heads: 4
  eq_wise_heads: true
  dropout: 0.0
data:
  input_dim: 6
  output_dim: 2
  sequence_length: 64
train:
  epochs: 120
  batch_size: 32
  learning_rate: 0.001
loss:
  l2: 0.6
  pde: 0.2
  bc: 0.1
  conservation: 0.1
output:
  checkpoint: checkpoints/S2_coupled_adr_best.pt
  metrics_csv: results/S2_coupled_adr_metric_comparison.csv
