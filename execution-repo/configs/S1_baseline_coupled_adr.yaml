stage: S1
dataset:
  root_dir: data/coupled_adr_v1
  manifest_path: data/coupled_adr_v1/manifest.json
model:
  name: FNO-residual
  input_dim: 6
  hidden_dim: 64
  output_dim: 2
  depth: 3
train:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  seed: 42
loss:
  l2: 0.7
  pde: 0.2
  bc: 0.1
output:
  root_dir: outputs/S1_baseline_coupled_adr
  run_name:
  summary_file: reports/run_summary.json
  checkpoint_file: checkpoints/S1_baseline_placeholder.pt
  metrics_file: results/S1_metrics.csv
  resolved_config_file: reports/resolved_config.yaml
